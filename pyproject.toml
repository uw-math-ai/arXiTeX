[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arxitex"
version = "0.2.1"
description = "Library for parsing arXiv papers into structured statements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Eric Leonen", email = "ericleonen@gmail.com" }
]
keywords = ["arxiv", "latex", "tex", "parsing", "theorem", "mathematics", "dataset"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
  "Topic :: Text Processing :: Markup :: LaTeX",
]

dependencies = [
  "requests",
  "kaggle",
  "pydantic",
  "bibtexparser",
  "boto3"
]

[project.optional-dependencies]
# LLM parsing method (provider-agnostic via litellm)
llm = [
  "litellm"
]

dev = [
  "pytest",
  "litellm"
]

slogan = [
  "jinja2"
]

embedding = [
  "torch",
  "sentence_transformers"
]

[project.urls]
Homepage = "https://github.com/uw-math-ai/arXiTeX"
Repository = "https://github.com/uw-math-ai/arXiTeX"
Issues = "https://github.com/uw-math-ai/arXiTeX/issues"

[project.scripts]
arxitex = "arxitex.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arxitex*"]

[tool.setuptools.package-data]
"arxitex.lib.statement.methods.tex" = ["*.sty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Put tests/ on sys.path so tests can import the `eval` support package.
pythonpath = ["tests"]
