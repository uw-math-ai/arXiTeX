[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arXiTeX"
version = "0.2.0"
description = "Library for parsing arXiv papers into structured statements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
  { name = "Eric Leonen", email = "ericleonen@gmail.com" }
]

dependencies = [
  "requests",
  "kaggle",
  "pydantic",
  "bibtexparser",
  "boto3"
]

[project.optional-dependencies]
# LLM parsing method (provider-agnostic via litellm)
llm = [
  "litellm"
]

dev = [
  "pytest",
  "litellm"
]

slogan = [
  "jinja2"
]

embedding = [
  "torch",
  "sentence_transformers"
]

[project.scripts]
arXiTeX = "arXiTeX.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["arXiTeX*"]

[tool.setuptools.package-data]
"arXiTeX.lib.statement.methods.tex" = ["*.sty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
