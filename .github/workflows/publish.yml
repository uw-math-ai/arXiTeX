name: Publish to PyPI

# Publishes the package to PyPI whenever a GitHub Release is published.
# Uses PyPI Trusted Publishing (OIDC) — no API tokens or secrets required.
#
# One-time setup on PyPI (Account -> Publishing -> Add a pending publisher):
#   PyPI project name: arxitex
#   Owner:             uw-math-ai
#   Repository:        arXiTeX
#   Workflow name:     publish.yml
#   Environment:       pypi

on:
  release:
    types: [published]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches the package version
        # PyPI uploads are permanent and a version can never be reused, so a
        # mistyped tag must fail here rather than ship a mislabeled wheel.
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$VERSION" ]; then
            echo "tag v$TAG does not match pyproject.toml version $VERSION"
            exit 1
          fi
          echo "tag v$TAG matches pyproject.toml version $VERSION"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check distribution metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
